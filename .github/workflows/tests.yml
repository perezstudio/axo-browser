# Builds Axo and runs its unit tests and every package's tests on GitHub-hosted Macs, on every
# pull request (#64). The UI tests run separately, in ui-tests.yml.
#
# The runner has no axo-chromium build, so the "Embed Chromium Engine" phase only warns; test runs
# use WebKit anyway (see CLAUDE.md). The iOS job builds the iOS app and runs the shared packages'
# tests on an iPhone simulator, as AxoiOS.xctestplan does without its UI tests.
name: Tests

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mac:
    name: Mac unit and package tests
    # macOS 27 with Xcode 27, Apple silicon.
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 27
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The project signs with the person's team, which the runner doesn't have, so sign to run
      # locally (ad hoc). Debug uses Axo.entitlements, which needs no provisioning profile.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -workspace Axo.xcworkspace -scheme Axo -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E 'error:' "$RUNNER_TEMP/build.log"; tail -50 "$RUNNER_TEMP/build.log"; exit 1; }
          # Warnings in any of Axo's own files (the app, its tests, and the packages; not
          # dependencies, which build under DerivedData) fail the build, as in the local checks.
          { grep -F "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/build.log" | grep ': warning:' | sort -u; } > "$RUNNER_TEMP/warnings.txt" || true
          if [[ -s "$RUNNER_TEMP/warnings.txt" ]]; then
            sed 's/^/::warning::/' "$RUNNER_TEMP/warnings.txt"
            echo "::error::The build has warnings in Axo's code."
            exit 1
          fi

      # Everything in Axo.xctestplan except the UI tests: the app's unit tests (hosted in Axo,
      # which test runs keep isolated) and every package's tests.
      - name: Test
        env:
          TEST_RUNNER_AXO_HOSTED_RUNNER: "1"
        run: |
          xcodebuild test-without-building \
            -workspace Axo.xcworkspace -scheme Axo -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            -skip-testing:AxoUITests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-results
          path: |
            ${{ runner.temp }}/Tests.xcresult
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/warnings.txt
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS build and package tests
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 27
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # An iPhone on the newest iOS runtime the runner has (simctl doesn't list runtimes in
      # version order), so a renamed model or an older runtime doesn't break the job.
      - name: Choose a simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          import re
          def version(runtime):
              return [int(n) for n in re.findall(r"iOS-(\d+(?:-\d+)*)", runtime)[0].split("-")] if "iOS-" in runtime else []
          # Only runtimes with an iPhone, so a newly added runtime with none never wins.
          runtimes = sorted(((r, [d for d in ds if d["name"].startswith("iPhone")]) for r, ds in json.load(sys.stdin)["devices"].items() if "iOS-" in r), key=lambda r: version(r[0]))
          runtimes = [r for r in runtimes if r[1]]
          print(runtimes[-1][1][-1]["udid"] if runtimes else "")')"
          [[ -n "$UDID" ]] || { echo "::error::No iPhone simulator on this runner."; exit 1; }
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"

      # The iOS app, and AxoiOS.xctestplan's package tests without its UI tests.
      - name: Build and test
        env:
          # Lets tests relax what this slow virtual simulator can't meet (timing ceilings).
          TEST_RUNNER_AXO_HOSTED_RUNNER: "1"
        run: |
          xcodebuild test \
            -workspace Axo.xcworkspace -scheme AxoiOS -destination "id=$SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/iOSTests.xcresult" \
            -disableAutomaticPackageResolution \
            -skip-testing:AxoiOSUITests \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/ios.log" 2>&1 \
            || { grep -E 'error:|failed' "$RUNNER_TEMP/ios.log" | head -40; tail -40 "$RUNNER_TEMP/ios.log"; exit 1; }
          grep -E 'TEST SUCCEEDED|Executed' "$RUNNER_TEMP/ios.log" | tail -3
          { grep -F "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/ios.log" | grep ': warning:' | sort -u; } > "$RUNNER_TEMP/ios-warnings.txt" || true
          if [[ -s "$RUNNER_TEMP/ios-warnings.txt" ]]; then
            sed 's/^/::warning::/' "$RUNNER_TEMP/ios-warnings.txt"
            echo "::error::The iOS build has warnings in Axo's code."
            exit 1
          fi

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOSTests-results
          path: |
            ${{ runner.temp }}/iOSTests.xcresult
            ${{ runner.temp }}/ios.log
            ${{ runner.temp }}/ios-warnings.txt
          if-no-files-found: ignore
          retention-days: 7
